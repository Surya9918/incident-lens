services:
  incident-lens:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      API_TOKEN: ${API_TOKEN:?Set a unique API_TOKEN of at least 32 characters}
      APP_ORIGIN: ${APP_ORIGIN:?Set the exact public HTTP(S) origin}
      DEMO_ENABLED: "false"
      RETENTION_DAYS: "7"
      MAX_INCIDENTS: "500"
    volumes:
      - incidents:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
volumes:
  incidents:
